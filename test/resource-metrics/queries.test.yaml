rule_files:
- rules.yaml
evaluation_interval: 30s
tests:
- name: complete containers including genuine zero
  interval: 30s
  input_series:
  - series: datum_compute_instance_cpu_usage_seconds_total{namespace="a",pod="app",node="worker",container="app",uid="current",runtime_class="general-purpose"}
    values: 0+3x12
  - series: datum_compute_instance_memory_working_set_bytes{namespace="a",pod="app",node="worker",container="app",uid="current",runtime_class="general-purpose"}
    values: 10x12
  - series: datum_compute_instance_cpu_source_timestamp_seconds{namespace="a",pod="app",node="worker",container="app",uid="current",runtime_class="general-purpose"}
    values: 0+30x12
  - series: datum_compute_instance_memory_source_timestamp_seconds{namespace="a",pod="app",node="worker",container="app",uid="current",runtime_class="general-purpose"}
    values: 0+30x12
  - series: kube_pod_container_resource_requests{resource="cpu",unit="core",namespace="a",pod="app",node="worker",container="app",uid="current"}
    values: 1x12
  - series: datum_compute_instance_cpu_usage_seconds_total{namespace="a",pod="app",node="worker",container="sidecar",uid="current",runtime_class="general-purpose"}
    values: 0+3x12
  - series: datum_compute_instance_memory_working_set_bytes{namespace="a",pod="app",node="worker",container="sidecar",uid="current",runtime_class="general-purpose"}
    values: 10x12
  - series: datum_compute_instance_cpu_source_timestamp_seconds{namespace="a",pod="app",node="worker",container="sidecar",uid="current",runtime_class="general-purpose"}
    values: 0+30x12
  - series: datum_compute_instance_memory_source_timestamp_seconds{namespace="a",pod="app",node="worker",container="sidecar",uid="current",runtime_class="general-purpose"}
    values: 0+30x12
  - series: kube_pod_container_resource_requests{resource="cpu",unit="core",namespace="a",pod="app",node="worker",container="sidecar",uid="current"}
    values: 1x12
  - series: kube_pod_info{namespace="a",pod="app",node="worker",uid="current"}
    values: 1x12
  - series: kube_pod_created{namespace="a",pod="app",node="worker",uid="current"}
    values: '0x12'
  - series: kube_pod_container_resource_requests{resource="memory",unit="byte",namespace="a",pod="app",node="worker",container="app",uid="current"}
    values: 1x12
  - series: kube_pod_container_resource_requests{resource="memory",unit="byte",namespace="a",pod="app",node="worker",container="sidecar",uid="current"}
    values: 1x12
  promql_expr_test:
  - expr: test_cpu_container
    eval_time: 3m
    exp_samples:
    - labels: test_cpu_container{namespace="a",pod="app",container="app"}
      value: 0.1
    - labels: test_cpu_container{namespace="a",pod="app",container="sidecar"}
      value: 0.1
  - expr: test_memory_container
    eval_time: 3m
    exp_samples:
    - labels: test_memory_container{namespace="a",pod="app",container="app"}
      value: 10
    - labels: test_memory_container{namespace="a",pod="app",container="sidecar"}
      value: 10
  - expr: test_cpu_node
    eval_time: 3m
    exp_samples:
    - labels: test_cpu_node{node="worker"}
      value: 0.2
  - expr: test_memory_node
    eval_time: 3m
    exp_samples:
    - labels: test_memory_node{node="worker"}
      value: 20
- name: real zero CPU remains zero
  interval: 30s
  input_series:
  - series: datum_compute_instance_cpu_usage_seconds_total{namespace="a",pod="app",node="worker",container="app",uid="current",runtime_class="general-purpose"}
    values: '0x12'
  - series: datum_compute_instance_memory_working_set_bytes{namespace="a",pod="app",node="worker",container="app",uid="current",runtime_class="general-purpose"}
    values: 10x12
  - series: datum_compute_instance_cpu_source_timestamp_seconds{namespace="a",pod="app",node="worker",container="app",uid="current",runtime_class="general-purpose"}
    values: 0+30x12
  - series: datum_compute_instance_memory_source_timestamp_seconds{namespace="a",pod="app",node="worker",container="app",uid="current",runtime_class="general-purpose"}
    values: 0+30x12
  - series: kube_pod_container_resource_requests{resource="cpu",unit="core",namespace="a",pod="app",node="worker",container="app",uid="current"}
    values: 1x12
  - series: kube_pod_info{namespace="a",pod="app",node="worker",uid="current"}
    values: 1x12
  - series: kube_pod_created{namespace="a",pod="app",node="worker",uid="current"}
    values: '0x12'
  - series: kube_pod_container_resource_requests{resource="memory",unit="byte",namespace="a",pod="app",node="worker",container="app",uid="current"}
    values: 1x12
  promql_expr_test:
  - expr: test_cpu_container
    eval_time: 3m
    exp_samples:
    - labels: test_cpu_container{namespace="a",pod="app",container="app"}
      value: 0
  - expr: test_memory_container
    eval_time: 3m
    exp_samples:
    - labels: test_memory_container{namespace="a",pod="app",container="app"}
      value: 10
  - expr: test_cpu_node
    eval_time: 3m
    exp_samples:
    - labels: test_cpu_node{node="worker"}
      value: 0
  - expr: test_memory_node
    eval_time: 3m
    exp_samples:
    - labels: test_memory_node{node="worker"}
      value: 10
