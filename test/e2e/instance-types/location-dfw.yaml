# A cluster-scoped Location naming the location this suite places workloads at.
# Workload admission validates placement locations against the live registry
# and the Workload controller refuses to render WorkloadDeployments when no
# location is registered, so every scenario in this suite needs at least one
# placeable location. The e2e control plane has the locations CRDs installed but
# an empty registry, so the suite seeds its own. Only a Ready location is
# placeable; the suite sets that condition through the status subresource.
apiVersion: locations.miloapis.com/v1alpha1
kind: Location
metadata:
  name: dfw
spec:
  locationClassRef:
    name: datum-managed
  topology:
    topology.datum.net/city-code: DFW
