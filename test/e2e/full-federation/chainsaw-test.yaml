apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: full-federation
spec:
  description: |
    End-to-end federation chain test.

    Exercises the complete path from WorkloadDeployment creation through to
    Instance projection on the control-plane cluster:

    1. Create WorkloadDeployment on control-plane.
    2. WorkloadDeploymentFederator replicates it to Karmada (ns-<uid> namespace).
    3. Karmada PropagationPolicy routes the WD to pop-dfw.
    4. WorkloadDeploymentReconciler on pop-dfw creates Instance test-full-fed-wd-0.
    5. InstanceReconciler on pop-dfw writes Instance back to Karmada with
       label meta.datumapis.com/upstream-cluster-name: cluster-single.
    6. InstanceProjector on control-plane creates a projection of the Instance
       in the project namespace.

    Cluster-name label: "cluster-single".
    The value is NOT the cell's cluster name. The management operator federates
    the WorkloadDeployment from its local control-plane cluster, which it
    registers with multicluster-runtime under the name "single" (both operators
    run discovery.mode=single in this environment, defaulting the cluster name to
    "single" per cmd/main.go singleClusterName). The federator stamps
    EncodeClusterName("single") = "cluster-single" onto the hub ns-<uid>
    namespace; the cell write-back and the projection both copy that namespace
    label verbatim, so the assertion holds regardless of which cell reconciles.

    Prerequisites: the management + both cell operators are deployed in-cluster
    (task e2e:up).

  template: true

  steps:
  - name: create-workload-deployment
    description: Create the WorkloadDeployment on the control-plane cluster.
    try:
    - apply:
        file: workload-deployment.yaml

  - name: assert-wd-in-downstream
    description: Assert WorkloadDeploymentFederator replicated the WD to Karmada and status is synced back.
    cluster: downstream
    try:
    - script:
        content: |
          kubectl --kubeconfig=../../../.test-infra/kubeconfigs/federation/compute-control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: downstreamNS
          value: ($stdout)
    - assert:
        timeout: 30s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: WorkloadDeployment
          metadata:
            namespace: ($downstreamNS)
            name: test-full-fed-wd
    - assert:
        # Wait for the cell operator to write status back to the Karmada WD.
        timeout: 60s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: WorkloadDeployment
          metadata:
            namespace: ($downstreamNS)
            name: test-full-fed-wd
          status:
            replicas: 1
            desiredReplicas: 1

  - name: assert-wd-on-pop-dfw
    description: Assert Karmada propagated the WD to pop-dfw and the cell reconciler set status.
    cluster: pop-dfw
    try:
    - script:
        content: |
          kubectl --kubeconfig=../../../.test-infra/kubeconfigs/federation/compute-control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: downstreamNS
          value: ($stdout)
    - assert:
        # Karmada propagation can take longer than a local apply.
        timeout: 60s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: WorkloadDeployment
          metadata:
            namespace: ($downstreamNS)
            name: test-full-fed-wd
          status:
            replicas: 1
            desiredReplicas: 1

  - name: assert-instance-on-pop-dfw
    description: Assert WorkloadDeploymentReconciler created an Instance on pop-dfw with a Ready condition.
    cluster: pop-dfw
    try:
    - script:
        content: |
          kubectl --kubeconfig=../../../.test-infra/kubeconfigs/federation/compute-control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: downstreamNS
          value: ($stdout)
    - assert:
        # This is the tail of the full chain (project WD → federate → Karmada
        # propagate to the cell → cell reconcile → Instance). On a constrained CI
        # runner that whole sequence can exceed 30s; 120s gives it room without
        # masking a real stall (the smoke path confirms the Instance does appear).
        timeout: 120s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: Instance
          metadata:
            namespace: ($downstreamNS)
            name: test-full-fed-wd-0
          # The Instance is blocked before scheduling completes (a scheduling
          # gate, or no matching Location in the e2e environment), so Ready is
          # definitively False — not indeterminate. The exact reason is
          # environment-dependent, so only the status is asserted.
          (status.conditions[?type == 'Ready'] | [0]):
            status: "False"

  - name: assert-instance-writeback-in-downstream
    description: Assert InstanceReconciler wrote the Instance back to Karmada.
    cluster: downstream
    try:
    - script:
        content: |
          kubectl --kubeconfig=../../../.test-infra/kubeconfigs/federation/compute-control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: downstreamNS
          value: ($stdout)
    - assert:
        timeout: 30s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: Instance
          metadata:
            namespace: ($downstreamNS)
            name: test-full-fed-wd-0
            labels:
              meta.datumapis.com/upstream-cluster-name: cluster-single

  - name: assert-instance-projected-to-control-plane
    description: Assert InstanceProjector created a projection with status on the control-plane.
    try:
    - assert:
        timeout: 30s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: Instance
          metadata:
            namespace: ($namespace)
            name: test-full-fed-wd-0
            labels:
              meta.datumapis.com/upstream-cluster-name: cluster-single
          # The Instance is blocked before scheduling completes (a scheduling
          # gate, or no matching Location in the e2e environment), so Ready is
          # definitively False — not indeterminate. The exact reason is
          # environment-dependent, so only the status is asserted.
          (status.conditions[?type == 'Ready'] | [0]):
            status: "False"
