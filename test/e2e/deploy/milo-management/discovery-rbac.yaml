apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compute-manager-project-discovery
rules:
  - apiGroups: ["resourcemanager.miloapis.com"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: compute-manager-project-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: compute-manager-project-discovery
subjects:
  - kind: ServiceAccount
    name: compute-manager
    namespace: compute-system
