apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ─────────────────────────────────────────────────────────────────────────────
# ONE-OFF validation overlay for compute#117 (not part of the regular e2e
# suite / Taskfile). Re-enables Milo discovery mode + the admission webhook
# on top of the e2e management-plane deploy, which normally runs
# single-cluster mode with the webhook disabled (see ../management). Applied
# manually by hand for this investigation only.
# ─────────────────────────────────────────────────────────────────────────────

resources:
  - ../management
  - ../../../../config/base/webhook
  - webhook-cert-secret.yaml
  - discovery-rbac.yaml

patches:
  - path: config_patch.yaml
  - path: deployment_patch.yaml
  - path: webhook_cabundle_patch.yaml
    target:
      kind: MutatingWebhookConfiguration
  - path: webhook_cabundle_patch.yaml
    target:
      kind: ValidatingWebhookConfiguration
