# Re-enables Milo discovery mode + the admission webhook for compute#117
# validation. Deviates from test/e2e/deploy/management/config_patch.yaml,
# which forces discovery.mode=single and omits webhookServer entirely
# because the harness normally has no Milo control plane and no cert-manager
# serving cert.
#
# discoveryKubeconfigPath / projectKubeconfigPath are left unset, so both
# resolve to the pod's own in-cluster config: the discovery informer watches
# Project objects on the SAME cluster compute-manager runs in. No real Milo
# API server backs this — we install just the Project/ProjectControlPlane
# CRDs so the informer has something real to list/watch against and grant
# RBAC for it. Because no Project object is ever created, no project is ever
# engaged (Provider.Get always returns "cluster not found") — this overlay
# validates the discoveryCache-sync readyz gate itself, not full per-project
# engagement, which needs a real Milo control plane's project-control-plane
# proxy endpoint that this harness cannot provide.
apiVersion: v1
kind: ConfigMap
metadata:
  name: compute-config
data:
  config.yaml: |
    apiVersion: apiserver.config.datumapis.com/v1alpha1
    kind: WorkloadOperator
    metricsServer:
      bindAddress: "0"
    webhookServer:
      tls:
        certDir: /tmp/k8s-webhook-server/serving-certs
    discovery:
      mode: milo
      clusterName: compute-control-plane
    featureFlags:
      enableReferencedDataGate: true
