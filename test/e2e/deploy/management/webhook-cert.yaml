# Self-signed serving cert for the admission webhook, issued by a plain
# cert-manager install (controller + cainjector). The production overlay
# gets its cert from the cert-manager CSI driver (config/components/csi-webhook-cert),
# which is not installed in Kind — this is the same pattern config/overlays/dev
# uses, pointed at the in-cluster webhook service instead of host.docker.internal
# since the API server calls it over cluster DNS, not from the host.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: compute-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: compute-serving-cert
  namespace: compute-system
spec:
  dnsNames:
    - webhook-service.compute-system.svc
    - webhook-service.compute-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: compute-webhook-cert
