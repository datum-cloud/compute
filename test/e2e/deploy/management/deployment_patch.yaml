# DEVIATION (required for Kind):
#   1. imagePullPolicy: IfNotPresent — the dev image is side-loaded into the Kind
#      node (task e2e:image:load); never attempt a registry pull.
#   2. Remove the webhook-server-tls volume + mount injected by
#      config/components/csi-webhook-cert. That volume is backed by the
#      cert-manager CSI driver (csi.cert-manager.io), which is not installed in
#      Kind, so the pod would fail to mount and never start. The webhook server
#      itself is disabled in config_patch.yaml, so the serving cert is unused.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-manager
spec:
  template:
    spec:
      containers:
        - name: manager
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: webhook-server-tls
              $patch: delete
      volumes:
        - name: webhook-server-tls
          $patch: delete
