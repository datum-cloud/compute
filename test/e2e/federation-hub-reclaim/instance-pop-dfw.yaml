# Cell Instance in the DFW POP cell, hand-crafted the way instance-writeback
# builds one: the linking labels below are exactly what the stateful control
# strategy stamps on a real cell Instance at creation, and the write-back path
# refuses to copy an Instance that is missing any of them.
#
# Hand-crafting the cell side (rather than federating a WorkloadDeployment) is
# deliberate: it keeps the cell Instance alive and continuously reconciled after
# the hub WorkloadDeployment is deleted, which is the only way to observe that
# write-back is owner-gated rather than merely idle.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: test-hub-reclaim-wd-0
  namespace: ($instanceNS)
  labels:
    compute.datumapis.com/workload-uid: "00000000-0000-0000-0000-000000000001"
    compute.datumapis.com/workload-deployment-uid: "00000000-0000-0000-0000-000000000002"
    compute.datumapis.com/instance-index: "0"
    compute.datumapis.com/workload-deployment-name: test-hub-reclaim-wd
    compute.datumapis.com/city-code: dfw
    compute.datumapis.com/workload-name: test-workload
    compute.datumapis.com/placement-name: default
spec:
  runtime:
    resources:
      instanceType: datumcloud/d1-standard-2
  networkInterfaces:
  - network:
      name: test-network
