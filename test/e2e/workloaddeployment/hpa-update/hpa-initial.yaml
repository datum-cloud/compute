apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chainsaw-hpa-update
  namespace: ($namespace)
spec:
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
