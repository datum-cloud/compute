apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chainsaw-stray
  namespace: ($namespace)
  labels:
    e2e.compute.datumapis.com/stray: "true"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: not-owned-by-compute
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
