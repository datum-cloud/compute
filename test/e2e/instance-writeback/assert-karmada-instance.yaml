# Assert the InstanceReconciler wrote the Instance back to Karmada.
#
# The write-back convention (see internal/controller/instance_controller.go):
# - Same namespace and name as the POP-cell Instance
# - Label meta.datumapis.com/upstream-cluster-name = "cluster-<clusterName>"
#   where <clusterName> is the multicluster-runtime cluster name registered by
#   wrappedSingleClusterProvider (always "single" in single-cluster mode)
# - Label meta.datumapis.com/upstream-namespace = the POP-cell namespace
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  namespace: ($instanceNS)
  name: test-writeback-instance
  labels:
    meta.datumapis.com/upstream-cluster-name: cluster-single
    meta.datumapis.com/upstream-namespace: ($instanceNS)
