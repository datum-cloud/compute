# Assert the PropagationPolicy was created in the Karmada namespace.
# The name follows propagationPolicyNameFor("dfw") = "workload-deployments-dfw".
# ($karmadaNS) is substituted by Chainsaw's template engine.
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  namespace: ($karmadaNS)
  name: workload-deployments-dfw
spec:
  resourceSelectors:
  - apiVersion: compute.datumapis.com/v1alpha
    kind: WorkloadDeployment
    labelSelector:
      matchLabels:
        topology.datum.net/city-code: dfw
  placement:
    clusterAffinity:
      labelSelector:
        matchLabels:
          topology.datum.net/city-code: dfw
