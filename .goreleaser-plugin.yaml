# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: datumctl-compute

before:
  hooks:
    - go mod tidy

builds:
  - id: datumctl-compute
    binary: datumctl-compute
    main: ./cmd/datumctl-compute
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-X main.version=v{{.Version}}"

archives:
  - id: datumctl-compute
    ids:
      - datumctl-compute
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
