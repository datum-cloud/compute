name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install resource metric rule validator
        run: |
          sudo apt-get update
          sudo apt-get install -y prometheus

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Console session client tests
        run: make test-console
