version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # field.ErrorList{} is the idiomatic Kubernetes validation init pattern;
      # preallocating requires knowing the error count in advance which is not
      # possible in recursive validation helpers.
      - linters:
          - prealloc
        path: internal/validation/
      # Append-built slices in this package are clearer without prealloc.
      - linters:
          - prealloc
        path: internal/controller/instancecontrol/
      # Policy fixtures are easier to read inline
      - linters:
          - goconst
        path: test/activitypolicy/
      # CLI output helpers (fmt.Fprintf to stdout) have no actionable error.
      - linters:
          - errcheck
        path: internal/cmd/.*
      - linters:
          - staticcheck
        text: 'SA1019: \(sigs\.k8s\.io/controller-runtime\.Result\)\.Requeue is deprecated'
      - linters:
          - staticcheck
        path: internal/validation/instance_validation\.go
        text: 'SA4006: this value of attachmentMethod is never used'
      - linters:
          - errcheck
        path: _test\.go
        source: '<-'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
