version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # field.ErrorList{} is the idiomatic Kubernetes validation init pattern;
      # preallocating requires knowing the error count in advance which is not
      # possible in recursive validation helpers.
      - linters:
          - prealloc
        path: internal/validation/
      # Test helpers that build slices via append are clearer without prealloc.
      - linters:
          - prealloc
        path: internal/controller/instancecontrol/
      - linters:
          - errcheck
        path: internal/cmd/.*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
