apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
# manifests.yaml is generated by controller-gen and should NOT be edited
# directly — `make manifests` will overwrite it.
- manifests.yaml

# Teach kustomize about the webhook clientConfig.service.{name,namespace}
# field paths so the namespace transform handles them automatically.
configurations:
- kustomizeconfig.yaml

# controller-gen names the webhook service `webhook-service`, and the Service
# in base/manager carries that name, so no patch rewrites the reference. A
# webhook added later is generated pointing at a service that exists.
patches:
# The configuration objects are cluster scoped in a control plane shared with
# every other service, so they keep service-specific names.
- patch: |-
    - op: replace
      path: /metadata/name
      value: compute-mutating
  target:
    kind: MutatingWebhookConfiguration
    name: mutating-webhook-configuration
- patch: |-
    - op: replace
      path: /metadata/name
      value: compute-validating
  target:
    kind: ValidatingWebhookConfiguration
    name: validating-webhook-configuration
