apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-manager
  labels:
    control-plane: compute
    app.kubernetes.io/name: compute
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: compute
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: compute
        app.kubernetes.io/name: compute
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        command:
        - /manager
        args:
          - --leader-elect=$(LEADER_ELECT)
          - --health-probe-bind-address=$(HEALTH_PROBE_BIND_ADDRESS)
          - --server-config=$(SERVER_CONFIG)
          - --federation-kubeconfig=$(FEDERATION_KUBECONFIG)
          - --enable-management-controllers=$(ENABLE_MANAGEMENT_CONTROLLERS)
          - --enable-cell-controllers=$(ENABLE_CELL_CONTROLLERS)
        env:
          - name: LEADER_ELECT
            value: "true"
          - name: HEALTH_PROBE_BIND_ADDRESS
            value: ":8081"
          - name: SERVER_CONFIG
            value: /config/config.yaml
          - name: FEDERATION_KUBECONFIG
            value: ""
          - name: ENABLE_MANAGEMENT_CONTROLLERS
            value: "false"
          - name: ENABLE_CELL_CONTROLLERS
            value: "false"
        image: ghcr.io/datum-cloud/compute:latest
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - name: config
          mountPath: /config
      serviceAccountName: compute-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: compute-config
