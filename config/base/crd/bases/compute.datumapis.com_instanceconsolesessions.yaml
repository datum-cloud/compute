---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Project
  name: instanceconsolesessions.compute.datumapis.com
spec:
  group: compute.datumapis.com
  names:
    kind: InstanceConsoleSession
    listKind: InstanceConsoleSessionList
    plural: instanceconsolesessions
    shortNames:
    - ics
    singular: instanceconsolesession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instanceRef.name
      name: Instance
      type: string
    - jsonPath: .spec.containerName
      name: Container
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.connectBefore
      name: Connect Before
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    name: v1alpha
    schema:
      openAPIV3Schema:
        description: |-
          InstanceConsoleSession runs one command in one container of an instance and
          connects a client to it, such as an interactive shell. Deleting the session
          stops the command.

          Each session is one invocation, so clients create sessions with generateName.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              InstanceConsoleSessionSpec is one command to run in one container of an
              instance. The whole spec is immutable: a different request is a new session.
            properties:
              clientPublicKey:
                description: |-
                  The client's 32-byte public key as 64 lowercase hexadecimal characters.
                  Only the holder of the matching private key can connect to the session,
                  and the private key never enters the API.
                pattern: ^[0-9a-f]{64}$
                type: string
              command:
                description: |-
                  The command to run, as an argument vector rather than a shell string. The
                  image must contain the executable and a shell, which the platform uses to
                  stop the command when the session ends. The arguments total at most 16 KiB.
                items:
                  maxLength: 16384
                  type: string
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-validations:
                - message: command must total at most 16 KiB
                  rule: self.map(arg, size(bytes(arg))).sum() <= 16384
              containerName:
                description: The exact name of the container to run the command in.
                maxLength: 63
                minLength: 1
                type: string
              instanceRef:
                description: The instance to run the command in, in the same project
                  as the session.
                properties:
                  name:
                    description: The instance's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    description: The instance's metadata.uid.
                    maxLength: 36
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
              stdin:
                description: Keeps the command's standard input open, with or without
                  a terminal.
                type: boolean
              terminal:
                description: |-
                  Allocates a terminal for the command, which merges its output streams.
                  Without one, standard output and standard error stay separate.
                type: boolean
              ttl:
                default: 15m
                description: How long the command may run once it starts, from 1m
                  to 1h.
                type: string
                x-kubernetes-validations:
                - message: ttl must be between 1m and 1h
                  rule: duration(self) >= duration('1m') && duration(self) <= duration('1h')
            required:
            - clientPublicKey
            - command
            - containerName
            - instanceRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            default:
              conditions:
              - lastTransitionTime: "1970-01-01T00:00:00Z"
                message: Waiting for the session to be prepared
                reason: Pending
                status: Unknown
                type: Ready
            description: |-
              InstanceConsoleSessionStatus is the session's progress as the platform
              reports it. Every field is output only.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectBefore:
                description: |-
                  The deadline for connecting. A session nobody connects to by then ends
                  with NotConnected.
                format: date-time
                type: string
              connection:
                description: Where to connect, set once the session is ready.
                properties:
                  endpointID:
                    description: The hexadecimal ID of the endpoint serving the session.
                    type: string
                  relayURLs:
                    description: The relays the endpoint is reachable through, nearest
                      first.
                    items:
                      type: string
                    type: array
                  target:
                    description: The host:port the client names when it opens a stream
                      to the endpoint.
                    type: string
                required:
                - endpointID
                - relayURLs
                - target
                type: object
              endedAt:
                description: When the session ended.
                format: date-time
                type: string
              exitCode:
                description: The command's exit code, set only when the command exited
                  on its own.
                format: int32
                type: integer
              expiresAt:
                description: 'When the command is stopped: startedAt plus spec.ttl.'
                format: date-time
                type: string
              recordedEvents:
                description: |-
                  The lifecycle events the control plane has recorded for the session in
                  the project's activity, so that each is recorded once. Only the control
                  plane writes it.
                items:
                  description: |-
                    InstanceConsoleSessionRecordedEvent tracks recording one of a session's
                    lifecycle events.
                  properties:
                    attemptedAt:
                      description: When the control plane last began recording the
                        event.
                      format: date-time
                      type: string
                    reason:
                      description: The event's reason, such as SessionStarted or SessionEnded.
                      maxLength: 64
                      minLength: 1
                      type: string
                    recorded:
                      description: |-
                        Whether the event is on record. An attempt that did not finish is
                        retried.
                      type: boolean
                  required:
                  - attemptedAt
                  - reason
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - reason
                x-kubernetes-list-type: map
              startedAt:
                description: When the command started.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
