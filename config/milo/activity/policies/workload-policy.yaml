# ActivityPolicy for Workload resources (compute.datumapis.com).
# Product noun is "workload". Display text is the resource name.
#
# Compute's identities on project control planes are system:-prefixed, so
# excluding them keeps its finalizer writes out of the timeline. Dry runs are
# silent, and so are updates that leave the spec alone, such as label edits.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: compute.datumapis.com-workload
spec:
  resource:
    apiGroup: compute.datumapis.com
    kind: Workload

  auditRules:
    - name: create
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.objectRef.name) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created workload {{ link(audit.objectRef.name, audit.objectRef) }}"

    # Clients that create with generateName send no name; it is on the response.
    - name: create-generated
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseObject.metadata) && has(audit.responseObject.metadata.name) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created workload {{ link(audit.responseObject.metadata.name, audit.responseObject) }}"

    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && (type(audit.requestObject) == map ? has(audit.requestObject.spec) : type(audit.requestObject) == list && audit.requestObject.exists(patch, patch.op in ['add', 'remove', 'replace', 'copy', 'move'] && (patch.path == '' || patch.path == '/spec' || patch.path.startsWith('/spec/') || (patch.op == 'move' && (patch.from == '/spec' || patch.from.startsWith('/spec/')))))) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated workload {{ link(audit.objectRef.name, audit.objectRef) }}"

    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} deleted workload {{ audit.objectRef.name }}"
