# ActivityPolicy for InstanceConsoleSession resources (compute.datumapis.com).
# Product noun is "shell session".
#
# Creation comes from the project audit log, so its actor is the requester.
# Start and end come from events compute's session controller records, so
# their actor is the controller; the requester, instance and container come
# from the event's annotations. Deletion is not recorded here: every session
# ends with a SessionEnded event, including one revoked by deleting it.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: compute.datumapis.com-instanceconsolesession
spec:
  resource:
    apiGroup: compute.datumapis.com
    kind: InstanceConsoleSession

  # Clients create sessions with generateName, so the request carries no name
  # and the name comes from the created object in the response.
  auditRules:
    - name: create
      match: "audit.verb == 'create' && has(audit.requestObject.spec) && has(audit.responseObject.metadata) && has(audit.responseObject.metadata.name) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300"
      summary: "{{ actor }} opened shell session {{ audit.responseObject.metadata.name }} in container {{ audit.requestObject.spec.containerName }} of instance {{ audit.requestObject.spec.instanceRef.name }}"

    - name: create-unnamed
      match: "audit.verb == 'create' && has(audit.requestObject.spec) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300"
      summary: "{{ actor }} opened a shell session in container {{ audit.requestObject.spec.containerName }} of instance {{ audit.requestObject.spec.instanceRef.name }}"

  eventRules:
    - name: session-started
      match: "event.reason == 'SessionStarted'"
      summary: "{{ event.metadata.annotations['compute.datumapis.com/requester'] }} connected to a shell session in container {{ event.metadata.annotations['compute.datumapis.com/container'] }} of instance {{ event.metadata.annotations['compute.datumapis.com/instance'] }}"

    - name: session-ended-exit-code
      match: "event.reason == 'SessionEnded' && 'compute.datumapis.com/exit-code' in event.metadata.annotations"
      summary: "Shell session of {{ event.metadata.annotations['compute.datumapis.com/requester'] }} in container {{ event.metadata.annotations['compute.datumapis.com/container'] }} of instance {{ event.metadata.annotations['compute.datumapis.com/instance'] }} ended: {{ event.metadata.annotations['compute.datumapis.com/reason'] }}, exit code {{ event.metadata.annotations['compute.datumapis.com/exit-code'] }}"

    - name: session-ended
      match: "event.reason == 'SessionEnded'"
      summary: "Shell session of {{ event.metadata.annotations['compute.datumapis.com/requester'] }} in container {{ event.metadata.annotations['compute.datumapis.com/container'] }} of instance {{ event.metadata.annotations['compute.datumapis.com/instance'] }} ended: {{ event.metadata.annotations['compute.datumapis.com/reason'] }}"
