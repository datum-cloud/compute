apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The owner the activity processor reads to route a failing policy's alerts.
# The platform's service catalog lists this repository under the compute
# service, team build.
labels:
  - pairs:
      meta.datumapis.com/service: compute
      meta.datumapis.com/team: build

resources:
  - instance-policy.yaml
  - instanceconsolesession-policy.yaml
  - workload-policy.yaml
  - workloaddeployment-policy.yaml
