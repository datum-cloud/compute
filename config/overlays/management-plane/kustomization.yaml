apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All namespaced resources land here. Override via Flux's targetNamespace
# (or by editing this overlay) to install into a different namespace.
namespace: compute-system

resources:
  - ../../base/manager
  - ../../base/webhook
components:
  - ../../components/leader_election
  - ../../components/controller_rbac
  - ../../components/resource-metrics
  - ../../components/high-availability
  - ../../components/management-controllers
  - ../../components/alerts
  - ../../components/csi-webhook-cert

patches:
- path: downstream_kubeconfig_patch.yaml
- path: discovery_mode_patch.yaml
