apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      name: compute-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: compute-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: ENABLE_MANAGEMENT_CONTROLLERS
                    value: "true"
