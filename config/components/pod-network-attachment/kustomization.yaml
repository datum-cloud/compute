apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - webhook.yaml

patches:
  - target:
      kind: ConfigMap
      name: compute-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: compute-config
      data:
        config.yaml: |
          apiVersion: apiserver.config.datumapis.com/v1alpha1
          kind: WorkloadOperator
          metricsServer:
            bindAddress: "0"
          webhookServer: {}
          discovery:
            quotaKubeconfigPath: /etc/quota-credentials/kubeconfig
  - target:
      kind: Deployment
      name: compute-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: compute-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: FEATURE_GATES
                    value: NetworkingIntegration=true,PodNetworkAttachment=true

configurations:
  - webhook-kustomizeconfig.yaml
