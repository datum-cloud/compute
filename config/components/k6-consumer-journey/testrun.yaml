apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: compute-consumer-journey
spec:
  # Reference to the k6 script ConfigMap generated by this component.
  script:
    configMap:
      name: compute-k6-consumer-journey
      file: consumer-deployment.js

  # The journey is a single sequential walk through the deployment path, so it
  # is always one runner with one iteration. Raising parallelism would start
  # independent runs with colliding run ids.
  parallelism: 1
  separate: false

  # Give a failed run's runner pod time to finish teardown before the operator
  # reaps it.
  cleanup: post

  runner:
    image: grafana/k6:latest

    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"

    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault

    # The suite authenticates with a Datum bearer token, never a projected
    # ServiceAccount token.
    automountServiceAccountToken: "false"
    serviceAccountName: ""

    env:
      - name: DATUM_API_ENDPOINT
        value: "https://api.staging.env.datum.net"
      - name: DATUM_ORG
        value: "datum-technology"
      - name: DATUM_PROJECT
        value: "datum-cloud"
      - name: DATUM_CREATE_PROJECT
        value: "false"
      - name: DATUM_CITY_CODE
        value: "DFW"
      - name: DATUM_IMAGE
        value: "docker.io/scotwells/datum-compute-hello-world:latest"
      - name: DATUM_IMAGE_PULL_SECRET
        value: "dockerhub-pull"
      - name: DATUM_SUMMARY_FILE
        value: "/tmp/summary.json"

    envFrom:
      # Must contain DATUM_TOKEN. Created out of band (ExternalSecret or
      # sealed secret) — never committed.
      - secretRef:
          name: compute-k6-consumer-journey-token
