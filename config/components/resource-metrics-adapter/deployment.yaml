apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-resource-metrics-adapter
  labels:
    app.kubernetes.io/name: compute-resource-metrics-adapter
    app.kubernetes.io/part-of: compute
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: compute-resource-metrics-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compute-resource-metrics-adapter
        app.kubernetes.io/part-of: compute
    spec:
      serviceAccountName: compute-resource-metrics-adapter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: ghcr.io/datum-cloud/compute:latest
          command:
            - /resource-metrics-adapter
          args:
            - --secure-port=8443
            - --tls-cert-file=/certs/tls.crt
            - --tls-private-key-file=/certs/tls.key
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /livez
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: serving-cert
              mountPath: /certs
              readOnly: true
      volumes:
        - name: serving-cert
          secret:
            secretName: compute-resource-metrics-adapter-serving-cert
