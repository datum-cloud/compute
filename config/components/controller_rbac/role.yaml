---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compute
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
- apiGroups:
  - compute.datumapis.com
  resources:
  - instances
  - workloaddeployments
  - workloads
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - compute.datumapis.com
  resources:
  - instances/finalizers
  - workloaddeployments/finalizers
  - workloads/finalizers
  verbs:
  - update
- apiGroups:
  - compute.datumapis.com
  resources:
  - instances/status
  - workloaddeployments/status
  - workloads/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.datumapis.com
  resources:
  - locations
  - networkcontexts
  - subnets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.datumapis.com
  resources:
  - networkbindings
  - subnetclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - quota.miloapis.com
  resources:
  - resourceclaims
  verbs:
  - create
  - delete
  - get
  - list
  - watch
