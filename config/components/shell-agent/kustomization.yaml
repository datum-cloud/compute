# Serves instance shell sessions in a cell: two shell agents, each paired by
# ordinal with a Datum Connect tunnel endpoint that is the agent's only way in.
#
# Everything lives in compute-shell-system, and the session target clients dial
# names that namespace, so include this component from a kustomization that does
# not rename namespaces (see config/overlays/cell-shell-agent). The deployment
# supplies three things this component only references:
#
# - ConfigMap exec-relays: DATUM_CONNECT_RELAY_URLS, the relays the endpoints
#   register with and the agents publish, nearest first.
# - ConfigMap exec-agent-federation-kubeconfig (key kubeconfig) and Secret
#   exec-agent-federation-client-cert: the Karmada hub credential, mounted
#   together at /etc/kubernetes/upstream/auth/. On the hub it needs only get
#   and patch on instanceconsolesessions and get, update and patch on their
#   status. The agent never lists or watches the hub: it reads each session's
#   hub copy by the namespace and name of the copy delivered to its cell.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - namespace.yaml
  - rbac.yaml
  - exec-admission-policy.yaml
  - service.yaml
  - agent.yaml
  - endpoint.yaml
  - networkpolicy.yaml

# datum-connect's CLI image is first published by datum-cloud/app#192. Until
# that release exists this tag is a placeholder; pin the released tag here.
images:
  - name: ghcr.io/datum-cloud/datum-connect
    newTag: v0.0.0-unreleased
