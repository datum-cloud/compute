apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      name: compute-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: compute-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                volumeMounts:
                  - name: quota-credentials
                    mountPath: /etc/quota-credentials
                    readOnly: true
            volumes:
              - name: quota-credentials
                secret:
                  secretName: compute-quota-credentials
