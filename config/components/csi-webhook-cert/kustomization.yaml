apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # Add the CSI webhook cert volume and volumeMount to the manager Deployment.
  - target:
      kind: Deployment
      name: compute-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: compute-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                volumeMounts:
                  - name: webhook-server-tls
                    mountPath: /tmp/k8s-webhook-server/serving-certs
                    readOnly: true
            volumes:
              - name: webhook-server-tls
                csi:
                  driver: csi.cert-manager.io
                  readOnly: true
                  volumeAttributes:
                    csi.cert-manager.io/fs-group: "65532"
                    csi.cert-manager.io/issuer-kind: ClusterIssuer
                    csi.cert-manager.io/issuer-name: datum-control-plane
                    csi.cert-manager.io/dns-names: compute-webhook.compute-system.svc,compute-webhook.compute-system.svc.cluster.local
  # Inject the CA bundle into webhook configurations from the ClusterIssuer's CA secret.
  - target:
      kind: MutatingWebhookConfiguration
    patch: |-
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingWebhookConfiguration
      metadata:
        name: ignored
        annotations:
          cert-manager.io/inject-ca-from-secret: cert-manager/datum-control-plane-ca
  - target:
      kind: ValidatingWebhookConfiguration
    patch: |-
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      metadata:
        name: ignored
        annotations:
          cert-manager.io/inject-ca-from-secret: cert-manager/datum-control-plane-ca
