apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: exec-agent
  namespace: compute-shell-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: exec-agent
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: exec-endpoint
      toPorts:
        - ports:
            - port: "7777"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Metrics, for the platform's scraper wherever in the cluster it runs.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: exec-endpoint
  namespace: compute-shell-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: exec-endpoint
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: exec-agent
      toPorts:
        - ports:
            - port: "7777"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Relays only: world excludes the cluster's own nodes and apiserver.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "7842"
              protocol: UDP
