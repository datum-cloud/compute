# What compute contributes to an entitled project's Patch assistant: the
# knowledge it reads, the tools it may call, and the skills it may follow.
#
# Until this landed, compute's capability document lived as raw JSON in
# datum-cloud/infra (apps/patch-assistant/overlays/staging/capability-documents.json),
# mounted into the assistant as a fixture. That put compute's provider content in
# the assistant deployer's repository, where compute's team neither reviewed nor
# versioned it. The document now lives here, beside the docs and runbooks it
# names, so a skill added under docs/agent/skills/ and its registration move in
# one change.
#
# ─── WHERE THIS OBJECT GOES ──────────────────────────────────────────────────
#
# CLUSTER-SCOPED, and deliberately so: a Milo project is a virtual control plane
# (one apiserver partitioned by the etcd key prefix /projects/<project>/), so an
# object written through a project's control-plane path is already inside that
# project and cannot be read through another's. The plane IS the tenancy
# boundary; a namespace would restate it more weakly. There is no
# metadata.namespace here and adding one would be a bug — the assistant LISTs
# capabilitybindings with no namespace segment, so a namespaced object would
# simply never be found.
#
# The consequence: this manifest entitles ONE project per apply, the project
# whose control-plane path it is applied through. It is NOT applied to Milo root
# and it is NOT applied to compute's workload cluster (where the kind is not even
# registered). The CRD definition is global — Milo exempts CRD *definitions* from
# project partitioning, so the assistant's own bundle registers the kind once and
# every project plane can see it — but instance data like this is per-project.
#
# At scale this is the service catalog's job: its projection controller
# materializes one binding per (project, entitled service) from compute's
# registration and the entitlement records, and deletes it when entitlement is
# revoked. This manifest is the same object that controller writes, which is why
# metadata.name is the AGENT name it uses rather than a name of our choosing —
# when the controller starts writing bindings, it converges on this object
# instead of creating a second one that would collide tool-for-tool.
apiVersion: capabilities.assistant.miloapis.com/v1alpha1
kind: CapabilityBinding
metadata:
  name: compute-diagnostics-agent
  labels:
    app.kubernetes.io/name: compute-diagnostics-agent
    app.kubernetes.io/part-of: compute.datumapis.com
spec:
  # Matches the catalog Service in ../service-catalog/service.yaml.
  serviceRef:
    name: compute-datumapis-com
  # The metering dimension tool invocations are reported under. A wrong value
  # misattributes every compute tool call, so it is required rather than derived.
  serviceName: compute.datumapis.com
  serviceAgentRef:
    name: compute-diagnostics-agent
  # COMPUTE's revision of the reviewed configuration below — the audit handle
  # that ties a capability which reached a customer's prompt back to the exact
  # content that was reviewed. Bump it whenever the knowledge, tools, or skills
  # below change; it is not metadata.generation and not the schema version.
  configurationVersion: v1
  # Where compute's own team reviews capability-gap reports — the project the
  # reports LAND in, never the consumer project this binding entitles. It is what
  # makes the report_capability_gap__compute tool exist at all; drop it and the
  # assistant can notice a gap in compute's tools with nothing to tell us. Must
  # match the producer project on the catalog Service (owner.producerProjectRef).
  reportingProject: datum-cloud

  knowledge:
    sources:
      # Served by cmd/compute-mcp from docs/agent/llms-full.txt (embed.go), so
      # there is no file to mount beside it. Fetched per turn under a short
      # timeout and a byte cap; if it is unreachable the turn degrades rather
      # than fails.
      - type: LLMDocs
        title: Compute resource model and condition semantics
        url: http://compute-mcp.compute-system.svc.cluster.local:8080/llms-full.txt
    # Short glosses that let the assistant reason about compute's kinds before
    # it has fetched anything.
    concepts:
      - gvk:
          group: compute.datumapis.com
          kind: Workload
        summary: "A customer's declared compute intent: an instance template plus one or more placements. Availability aggregates upward from its deployments."
      - gvk:
          group: compute.datumapis.com
          kind: WorkloadDeployment
        summary: "One Workload projected onto one cell/location. Where location, city code, and referenced-data resolution are settled."
      - gvk:
          group: compute.datumapis.com
          kind: Instance
        summary: "A single running unit within a deployment. Carries the most specific conditions: Ready, Available, Programmed, QuotaGranted, ReferencedDataReady."

  tools:
    mcpServers:
      - # Namespaces these tools as "compute__<tool>" in the prompt, so another
        # provider publishing the same tool name cannot collide with compute's.
        name: compute
        # compute-mcp's ClusterIP, dialed directly.
        #
        # THIS IS THE ONE FIELD THAT MUST CHANGE BEFORE PRODUCTION. The assistant
        # refuses to dial an endpoint outside CAPABILITY_MCP_ENDPOINT_HOSTS and
        # reports Composed=False on this binding when it does. That list is unset
        # in staging (an empty list permits any host), which is why a direct dial
        # works there; the production overlay sets it to the AI gateway. A direct
        # endpoint in production would also bypass the gateway-side copy of the
        # allow-list below, go unmetered, and receive no caller identity.
        # Production needs an MCPRoute fronting compute-mcp and this rewritten to
        # it — no such route exists today.
        endpoint: http://compute-mcp.compute-system.svc.cluster.local:8080/mcp
        toolSelector:
          # The reviewed allow-list, matched against the RAW names compute-mcp
          # advertises (the assistant adds the "compute__" prefix itself). Not a
          # hint: a tool compute-mcp serves but this list omits is never exposed
          # to the model, and the AI gateway enforces the same list independently.
          # An empty include would mean no tools at all, never "all of them".
          include:
            # Diagnosis, read-only.
            - compute_workloads_list
            - compute_workloads_get
            - compute_instances_list
            - compute_workload_diagnose
            - compute_reason_explain
            # Creation inputs. Both write nothing: instance_types_list reports the
            # sizes a workload may ask for, workload_render is a pure function
            # from inputs to a manifest. Everything that actually changes a
            # customer's resources comes from the assistant's own base tools
            # (resources_plan / resources_apply), which act as the caller and
            # carry the confirmation contract.
            - compute_instance_types_list
            - compute_workload_render
        # Compute publishes no mutating tool. Keep this empty rather than absent
        # so the intent is explicit to anyone reviewing the next change.
        mutating: []

  # Reviewed, step-by-step triage procedures. Only name and description enter the
  # prompt; the body at source is fetched on demand via the assistant's load_skill
  # tool, so all seven cost almost nothing until one is actually relevant. A skill
  # grants no privilege — it can only point at tools that are independently on the
  # allow-list above. Each source is served by cmd/compute-mcp from
  # docs/agent/skills/<name>.md; the URL says "runbooks" while the repo says
  # "skills" (see cmd/compute-mcp/docs.go).
  skills:
    - name: workload-not-available
      description: Triage a compute Workload that is not available, from symptom to root cause and owner
      source: http://compute-mcp.compute-system.svc.cluster.local:8080/runbooks/workload-not-available.md
    - name: quota-triage
      description: Distinguish QuotaExceeded, QuotaNoBudget, PendingEvaluation and quota backend faults, and act on each
      source: http://compute-mcp.compute-system.svc.cluster.local:8080/runbooks/quota-triage.md
    - name: instance-not-ready
      description: Diagnose ImageUnavailable, InstanceCrashing, ConfigurationError and stuck Provisioning on compute Instances
      source: http://compute-mcp.compute-system.svc.cluster.local:8080/runbooks/instance-not-ready.md
    - name: referenced-data-triage
      description: 'Resolve ReferencedDataReady failures: missing, unauthorized, or oversized ConfigMaps and Secrets'
      source: http://compute-mcp.compute-system.svc.cluster.local:8080/runbooks/referenced-data-triage.md
    - name: placement-triage
      description: Handle NoMatchingLocation, AmbiguousServingLocation and CityCodeMismatch — all platform faults
      source: http://compute-mcp.compute-system.svc.cluster.local:8080/runbooks/placement-triage.md
    - name: stalled-transient
      description: Recognize a provider job wedged in transient and act on the stalled actionability state rather than waiting it out
      source: http://compute-mcp.compute-system.svc.cluster.local:8080/runbooks/stalled-transient.md
    - name: workload-create
      description: 'Deploy something new: prerequisites, the choices that are final at create, and render, plan, show, confirm, then apply'
      source: http://compute-mcp.compute-system.svc.cluster.local:8080/runbooks/workload-create.md

  authority:
    # The read scope this agent is granted. Kind "*" is every compute kind — the
    # diagnosis walk crosses Workload, WorkloadDeployment and Instance in one
    # answer. Reads still run as the person who asked, so this widens nothing
    # they could not already read themselves.
    reads:
      - gvk:
          group: compute.datumapis.com
          kind: "*"
    maxTaskDurationSeconds: 60
