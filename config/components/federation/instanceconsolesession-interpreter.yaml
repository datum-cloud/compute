# The cell's shell agent writes a session's status only on its cell copy.
# Karmada reflects it from every cell the copy reaches and aggregates it onto
# the hub copy, where compute's session controller reads it.
#
# A location can map to more than one cell, and only the cell that runs the
# session's instance writes anything; every other cell keeps the Pending
# status the API defaults. Aggregation therefore takes the status that says
# the most: a claim first, then an end, then anything else. A status that says
# less never replaces the hub copy's, so a cell that left the session alone
# cannot wipe the claim or refusal of the cell that runs the instance.
apiVersion: config.karmada.io/v1alpha1
kind: ResourceInterpreterCustomization
metadata:
  name: instanceconsolesession
spec:
  target:
    apiVersion: compute.datumapis.com/v1alpha
    kind: InstanceConsoleSession
  customizations:
    statusReflection:
      luaScript: |
        function ReflectStatus(observedObj)
          if observedObj.status == nil then
            return nil
          end
          return observedObj.status
        end
    statusAggregation:
      luaScript: |
        local function weight(status)
          if status == nil then
            return 0
          end
          if status.connection ~= nil then
            return 3
          end
          if status.conditions == nil then
            return 0
          end
          for i = 1, #status.conditions do
            local condition = status.conditions[i]
            if condition.type == "Ready" and condition.status == "False" then
              return 2
            end
          end
          if #status.conditions > 0 then
            return 1
          end
          return 0
        end

        function AggregateStatus(desiredObj, statusItems)
          if statusItems == nil then
            return desiredObj
          end
          local best = nil
          local bestWeight = 0
          for i = 1, #statusItems do
            local status = statusItems[i].status
            local w = weight(status)
            if w > bestWeight then
              best = status
              bestWeight = w
            end
          end
          if best == nil or bestWeight < weight(desiredObj.status) then
            return desiredObj
          end
          desiredObj.status = best
          return desiredObj
        end
