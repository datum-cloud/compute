# Deliberately unbound — do not add a Role, ClusterRole, or binding for this
# account. compute-mcp reads as the caller, using the bearer token off each
# request, so the asker's own RBAC is the single enforcement point; granting
# this account read access to Workloads would restore exactly the ambient
# authority that removes, for every tenant, one prompt injection away.
#
# The token is still mounted: controller-runtime's GetConfig fails without the
# projected token file, and uses it for the endpoint and CA only.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: compute-mcp
    app.kubernetes.io/name: compute-mcp
  name: compute-mcp
