# Project control-plane access runs as the caller, using the bearer token off
# each request. This account has only a local namespaced Lease role for the
# atomic exec approval ledger. Do not grant it access to project resources:
# the asker's own RBAC is the single enforcement point for those.
#
# The local token is used only for coordination Leases. The control plane's
# address and CA come from the kubeconfig the deployment supplies, and
# clientForToken strips every credential before setting the caller's.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: compute-mcp
    app.kubernetes.io/name: compute-mcp
  name: compute-mcp
