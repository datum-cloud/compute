apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compute-mcp-exec-nonces
rules:
  # Atomic Lease creation consumes one approved command across both replicas.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compute-mcp-exec-nonces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: compute-mcp-exec-nonces
subjects:
  - kind: ServiceAccount
    name: compute-mcp
