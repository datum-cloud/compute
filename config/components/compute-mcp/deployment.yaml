apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: compute-mcp
    app.kubernetes.io/name: compute-mcp
  name: compute-mcp
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
      app.kubernetes.io/instance: compute-mcp
      app.kubernetes.io/name: compute-mcp
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/instance: compute-mcp
        app.kubernetes.io/name: compute-mcp
    spec:
      # Unbound account, and the token is mounted only so in-cluster config can
      # resolve the endpoint and CA — see service_account.yaml.
      serviceAccountName: compute-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compute-mcp
          image: ghcr.io/datum-cloud/compute-mcp:latest
          imagePullPolicy: Always
          args:
            - --addr=:8080
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
      # No writable volume: the binary is static, the docs it serves are
      # compiled in, and nothing here writes to disk.
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
