apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: compute-mcp
    app.kubernetes.io/name: compute-mcp
  name: compute-mcp
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
      app.kubernetes.io/instance: compute-mcp
      app.kubernetes.io/name: compute-mcp
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/instance: compute-mcp
        app.kubernetes.io/name: compute-mcp
    spec:
      # Project control-plane reads and writes still use the caller's token.
      # This account can only create/list/delete local Leases for the shared
      # one-time exec approval ledger.
      #
      # This template carries no control plane configuration: which control
      # plane the server reads is deployment topology, so the deployer patches
      # in a kubeconfig volume and KUBECONFIG. Without one the binary refuses to
      # start rather than falling back to the local cluster's API server; see
      # checkControlPlaneEndpoint in cmd/compute-mcp.
      serviceAccountName: compute-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compute-mcp
          # The manager's image. It carries both binaries — they are released
          # together and share the condition vocabulary internal/agent's
          # catalog classifies — so `command` picks this one, exactly as the
          # manager's own Deployment names /manager.
          image: ghcr.io/datum-cloud/compute:latest
          imagePullPolicy: Always
          command:
            - /compute-mcp
          args:
            - --addr=:8080
            - --tls-cert-file=/etc/compute-mcp/tls/tls.crt
            - --tls-key-file=/etc/compute-mcp/tls/tls.key
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Rollout remains safe before the shared secret is provisioned:
            # compute-mcp omits its exec tools when this key is absent.
            - name: COMPUTE_ASSISTANT_EXEC_KEY
              valueFrom:
                secretKeyRef:
                  name: compute-assistant-exec-key
                  key: key
                  optional: true
          # The port keeps its number and its name although it now carries
          # https: NetworkPolicies select it by number and the Service by name.
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: compute-mcp-certs
              mountPath: /etc/compute-mcp/tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      # No writable volume: the binary is static, the docs it serves are
      # compiled in, and nothing here writes to disk.
      volumes:
        # The serving certificate. The assistant sends the caller's bearer token
        # to /mcp and refuses to do so over plain http, and it trusts this
        # issuer. The driver renews the files in place and the server reloads
        # them without a restart.
        #
        # dns-names must cover the host in the capability documents' URLs
        # (config/components/assistant-capability), so they follow the Service
        # name and the namespace this component is deployed to.
        - name: compute-mcp-certs
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: datum-control-plane
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/common-name: compute-mcp
              csi.cert-manager.io/dns-names: compute-mcp,compute-mcp.compute-system.svc,compute-mcp.compute-system.svc.cluster.local
              csi.cert-manager.io/key-usages: digital signature,key encipherment,server auth
              # The container's group, so the non-root process can read the key.
              csi.cert-manager.io/fs-group: "65532"
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
