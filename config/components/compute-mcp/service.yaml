# Cluster-internal only: the assistant reaches /mcp over this Service's DNS
# name, and no Gateway or HTTPRoute fronts it. The pod serves https on this
# port with a certificate for this Service's names, because the assistant sends
# the caller's bearer token here and will not send one over plain http. The
# port is still named `http`; renaming it would break whatever selects it by
# name.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: compute-mcp
    app.kubernetes.io/name: compute-mcp
  name: compute-mcp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/instance: compute-mcp
    app.kubernetes.io/name: compute-mcp
