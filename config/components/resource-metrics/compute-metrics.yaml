apiVersion: resourcemetrics.miloapis.com/v1alpha1
kind: ResourceMetricsPolicy
metadata:
  name: compute-metrics
spec:
  generators:
    # -------------------------------------------------------------------------
    # Workload metrics
    # -------------------------------------------------------------------------
    - name: workload-info
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: workloads
      families:
        - name: datum_cloud_compute_workload_info
          help: "Information about workload"
          type: gauge
          metrics:
            - labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: uid
                  value: "object.metadata.uid"

    - name: workload-created
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: workloads
      families:
        - name: datum_cloud_compute_workload_created
          help: "Unix creation timestamp of the workload"
          type: gauge
          metrics:
            - value: "int(timestamp(object.metadata.creationTimestamp))"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

    - name: workload-status-condition
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: workloads
      families:
        - name: datum_cloud_compute_workload_status_condition
          help: "The current status conditions of the workload"
          type: gauge
          metrics:
            - forEach: "object.status.conditions"
              value: "item.status == 'True' ? 1.0 : 0.0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: condition
                  value: "item.type"
                - name: reason
                  value: "item.reason"
                - name: status
                  value: "item.status"

    - name: workload-replicas
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: workloads
      families:
        - name: datum_cloud_compute_workload_status_replicas
          help: "The number of instances that currently exist for the workload"
          type: gauge
          metrics:
            - value: "has(object.status) && has(object.status.replicas) ? object.status.replicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

        - name: datum_cloud_compute_workload_status_replicas_desired
          help: "The desired number of instances for the workload"
          type: gauge
          metrics:
            - value: "has(object.status) && has(object.status.desiredReplicas) ? object.status.desiredReplicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

        - name: datum_cloud_compute_workload_status_replicas_ready
          help: "The number of instances that are ready for the workload"
          type: gauge
          metrics:
            - value: "has(object.status) && has(object.status.readyReplicas) ? object.status.readyReplicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

        - name: datum_cloud_compute_workload_status_replicas_current
          help: "The number of instances running the latest workload settings and programmed"
          type: gauge
          metrics:
            - value: "has(object.status) && has(object.status.currentReplicas) ? object.status.currentReplicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

        - name: datum_cloud_compute_workload_status_replicas_updated
          help: "The number of instances updated to the latest template revision"
          type: gauge
          metrics:
            - value: "has(object.status) && has(object.status.updatedReplicas) ? object.status.updatedReplicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

        - name: datum_cloud_compute_workload_status_deployments
          help: "The number of deployments that currently exist for the workload"
          type: gauge
          metrics:
            - value: "has(object.status) && has(object.status.deployments) ? object.status.deployments : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

    - name: workload-placement-replicas
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: workloads
      families:
        - name: datum_cloud_compute_workload_placement_status_replicas
          help: "The number of instances that currently exist for the placement"
          type: gauge
          metrics:
            - forEach: "has(object.status) && has(object.status.placements) ? object.status.placements : []"
              value: "has(item.replicas) ? item.replicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: placement
                  value: "item.name"

        - name: datum_cloud_compute_workload_placement_status_replicas_desired
          help: "The desired number of instances for the placement"
          type: gauge
          metrics:
            - forEach: "has(object.status) && has(object.status.placements) ? object.status.placements : []"
              value: "has(item.desiredReplicas) ? item.desiredReplicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: placement
                  value: "item.name"

        - name: datum_cloud_compute_workload_placement_status_replicas_ready
          help: "The number of instances that are ready for the placement"
          type: gauge
          metrics:
            - forEach: "has(object.status) && has(object.status.placements) ? object.status.placements : []"
              value: "has(item.readyReplicas) ? item.readyReplicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: placement
                  value: "item.name"

    - name: workload-placement-location-info
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: workloads
      families:
        - name: datum_cloud_compute_workload_placement_location_info
          help: "The locations a placement currently resolves to"
          type: gauge
          metrics:
            # One series per (placement, location): the inner map flattens away
            # because forEach takes a single list.
            - forEach: |
                has(object.status) && has(object.status.placements) ?
                  object.status.placements.map(p,
                    has(p.locations) ?
                      p.locations.map(l, {'placement': p.name, 'location': l.name}) :
                      []
                  ).flatten() :
                  []
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: placement
                  value: "item.placement"
                - name: location
                  value: "item.location"

    # -------------------------------------------------------------------------
    # WorkloadDeployment metrics
    # -------------------------------------------------------------------------
    - name: workload-deployment-info
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: workloaddeployments
      families:
        - name: datum_cloud_compute_workload_deployment_info
          help: "Information about workload deployment"
          type: gauge
          metrics:
            - labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: uid
                  value: "object.metadata.uid"
                - name: compute_datumapis_com_workload_uid
                  value: |
                    has(object.metadata.labels) && 'compute.datumapis.com/workload-uid' in object.metadata.labels ?
                      object.metadata.labels['compute.datumapis.com/workload-uid'] :
                      ''

    - name: workload-deployment-created
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: workloaddeployments
      families:
        - name: datum_cloud_compute_workload_deployment_created
          help: "Unix creation timestamp of the workload deployment"
          type: gauge
          metrics:
            - value: "int(timestamp(object.metadata.creationTimestamp))"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

    - name: workload-deployment-status-condition
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: workloaddeployments
      families:
        - name: datum_cloud_compute_workload_deployment_status_condition
          help: "The current status conditions of the workload deployment"
          type: gauge
          metrics:
            - forEach: "object.status.conditions"
              value: "item.status == 'True' ? 1.0 : 0.0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: condition
                  value: "item.type"
                - name: reason
                  value: "item.reason"
                - name: status
                  value: "item.status"

    - name: workload-deployment-replicas
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: workloaddeployments
      families:
        - name: datum_cloud_compute_workload_deployment_status_replicas
          help: "The number of instances that currently exist for the deployment"
          type: gauge
          metrics:
            - value: "has(object.status) && has(object.status.replicas) ? object.status.replicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

        - name: datum_cloud_compute_workload_deployment_status_replicas_desired
          help: "The desired number of instances for the deployment"
          type: gauge
          metrics:
            - value: "has(object.status) && has(object.status.desiredReplicas) ? object.status.desiredReplicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

        - name: datum_cloud_compute_workload_deployment_status_replicas_ready
          help: "The number of instances that are ready for the deployment"
          type: gauge
          metrics:
            - value: "has(object.status) && has(object.status.readyReplicas) ? object.status.readyReplicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

        - name: datum_cloud_compute_workload_deployment_status_replicas_current
          help: "The number of instances running the latest workload settings and programmed"
          type: gauge
          metrics:
            - value: "has(object.status) && has(object.status.currentReplicas) ? object.status.currentReplicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

        - name: datum_cloud_compute_workload_deployment_status_replicas_updated
          help: "The number of instances updated to the latest template revision"
          type: gauge
          metrics:
            - value: "has(object.status) && has(object.status.updatedReplicas) ? object.status.updatedReplicas : 0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

    # -------------------------------------------------------------------------
    # Instance metrics
    # -------------------------------------------------------------------------
    - name: instance-info
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: instances
      families:
        - name: datum_cloud_compute_instance_info
          help: "Information about instance"
          type: gauge
          metrics:
            - labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: uid
                  value: "object.metadata.uid"
                - name: compute_datumapis_com_workload_deployment_uid
                  value: |
                    has(object.metadata.labels) && 'compute.datumapis.com/workload-deployment-uid' in object.metadata.labels ?
                      object.metadata.labels['compute.datumapis.com/workload-deployment-uid'] :
                      ''
                - name: compute_datumapis_com_workload_uid
                  value: |
                    has(object.metadata.labels) && 'compute.datumapis.com/workload-uid' in object.metadata.labels ?
                      object.metadata.labels['compute.datumapis.com/workload-uid'] :
                      ''
                # Metering and billing break instance cost out by runtime
                # class, so the value comes from the instance spec rather than
                # from the runtime a cell happens to use. Whichever provider
                # registers a class also declares whether that class is the
                # default, so compute cannot name a class here. An instance
                # that selects no class reports an empty dimension, which the
                # catch-all billing rate prices.
                - name: runtime_class
                  value: |
                    has(object.spec.runtime) && has(object.spec.runtime.class) && object.spec.runtime.class != '' ?
                      object.spec.runtime.class :
                      ''
                - name: instance_type
                  value: |
                    has(object.spec.runtime) && has(object.spec.runtime.resources) && has(object.spec.runtime.resources.instanceType) ?
                      object.spec.runtime.resources.instanceType :
                      ''
                - name: location
                  value: |
                    has(object.spec.location) && has(object.spec.location.name) ?
                      object.spec.location.name :
                      ''

    - name: instance-created
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: instances
      families:
        - name: datum_cloud_compute_instance_created
          help: "Unix creation timestamp of the instance"
          type: gauge
          metrics:
            - value: "int(timestamp(object.metadata.creationTimestamp))"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

    - name: instance-status-condition
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: instances
      families:
        - name: datum_cloud_compute_instance_status_condition
          help: "The current status conditions of the instance"
          type: gauge
          metrics:
            - forEach: "object.status.conditions"
              value: "item.status == 'True' ? 1.0 : 0.0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: condition
                  value: "item.type"
                - name: reason
                  value: "item.reason"
                - name: status
                  value: "item.status"

    - name: instance-network-interface-info
      resource:
        group: compute.datumapis.com
        version: v1alpha
        resource: instances
      families:
        - name: datum_cloud_compute_instance_network_interface_info
          help: "Information about instance network interfaces"
          type: gauge
          metrics:
            - forEach: "object.status.networkInterfaces"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: network_ip
                  value: "has(item.assignments) ? item.assignments.networkIP : ''"
                - name: external_ip
                  value: "has(item.assignments) && has(item.assignments.externalIP) ? item.assignments.externalIP : ''"
