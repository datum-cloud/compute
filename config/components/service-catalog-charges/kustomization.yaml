apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# compute's prices. Every environment that bills compute usage includes this
# component; staging gets it through service-catalog-staging.
patches:
  - path: service-configuration-charges.yaml
    target:
      group: services.miloapis.com
      version: v1alpha1
      kind: ServiceConfiguration
      name: compute
