apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compute-internal-dns-publisher
rules:
  - apiGroups: ["dns.networking.miloapis.com"]
    resources: ["dnsresolvercontexts", "dnscontributiongrants"]
    verbs: ["get", "list"]
  - apiGroups: ["dns.networking.miloapis.com"]
    resources: ["dnsregistrations", "dnsrecordcontributions"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["dns.networking.miloapis.com"]
    resources: ["dnsrecordcontributions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["compute.datumapis.com"]
    resources: ["instances/status"]
    verbs: ["get", "patch"]
