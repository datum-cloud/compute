# pnpm settings for this plugin. It is a single package with its own lockfile,
# not a workspace member, so there is no `packages:` list.

# Wait a day before installing a newly published version. Most compromised
# releases are pulled within hours. Our own packages are published and
# consumed across repos on the same day, so the delay must not hold them back.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@datum-cloud/*'
  # Added by `pnpm import`: npm had resolved these versions while they were
  # under a day old, and exempting them kept them. They can go once a later
  # update moves past them.
  - '@module-federation/dts-plugin@2.9.3'
  - '@module-federation/error-codes@2.9.3'
  - '@module-federation/managers@2.9.3'
  - '@module-federation/runtime-core@2.9.3'
  - '@module-federation/runtime@2.9.3'
  - '@module-federation/sdk@2.9.3'
  - '@module-federation/third-party-dts-extractor@2.9.3'
  - '@module-federation/vite@1.23.9'
  - '@tanstack/react-virtual@3.14.26'
  - '@tanstack/virtual-core@3.19.11'
  - lucide-react@1.67.0

# Reject a version published with weaker provenance than the versions before
# it, such as a release pushed with a stolen token for a package that normally
# publishes from CI.
trustPolicy: no-downgrade

# esbuild and @sentry/cli check their platform binaries on install. CI and the
# image install with --ignore-scripts.
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  fsevents: false

# @tanstack/react-table ships agent skills, and pnpm 12 asks before exposing
# them. Deny them: the org decided no package's skills should run.
permissions:
  '@tanstack/react-table':
    skills: false

overrides:
  '@module-federation/dts-plugin>undici': ^7.30.1
  minimatch: 11.0.9
  glob: 14.0.6
  # 6.3.1, which @babel/core pulls in, was published without provenance after
  # earlier semver releases had it, so trustPolicy rejects it. 6.3.2 has it.
  semver@6: ^6.3.2
