apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: compute-workloads-plugin
spec:
  parentRefs:
    # Overridden at the environment level to point at the shared
    # external-gateway (see infra: apps/compute-workloads-plugin/<env>).
    - name: external
      namespace: gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: compute-workloads-plugin
          kind: Service
          group: ''
          port: 80
